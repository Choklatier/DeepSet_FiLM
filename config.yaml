# Manages the input data to the NN
Inputs:

  # Load input arrays if enabled
  LOAD_ARRAYS : False
  # Save input arrays if enabled
  SAVE_ARRAYS : True
  ARRAYS_FILEPATH : "data.npz"
  JET_MATCHED_ARRAYS_FILEPATH : "jet_matched_data.npz"
  
  # Variables to define from available information
  variables_to_define: 
    "met_px" : "met_pt * cos(met_phi)"
    "met_py" : "met_pt * sin(met_phi)"
    "trk_x_pca" : "-trk_d0 * sin(trk_phi)"
    "trk_y_pca" : "trk_d0 * cos(trk_phi)"

  # columns used for tracks features
  trk_columns:
    - "trk_x_pca"
    - "trk_y_pca"
    - "trk_d0"
    - "trk_z0"
    # - "trk_pt"
    # - "trk_phi"
    - "trk_px"
    - "trk_py"
    - "trk_eta"
    - "trk_charge"
  
  # columns used for event-level features
  event_columns:
    - "met_px"
    - "met_py"
    - "nTrack"
    - "nJet"
  
  # columns used to build jet arrays
  jet_columns:
    - "jet_pt" 
    - "jet_eta" 
    - "jet_phi"
    - "jet_mass"

# Parametrise the NN architecture
Architecture:
  MAX_TRACKS: 32
  MAX_TRACK_PAIRS: 16
  PHI_DIM: 256
  ATTENTION_HIDDEN_DIM: 16
  RHO_DIM: 16
  LATENT_DIM: 8
  N_HIDDEN_LAYERS: 2

# Training settings  
Training:
  MAX_EVENTS: 100000
  BATCH_SIZE: 256
  N_EPOCHS: 8 #20
  K_FOLDS : 5
  LEARNING_RATE : 0.0001

  # For VAE networks
  STOP_RHO_GRADIENT: True
  BETA_KL_WEIGHT : 1 #0.1

  # For VICReg
  LAMBDA_INV : 10.0 # Invariance loss coeff
  LAMBDA_VAR : 1.0 # Variance loss coeff
  LAMBDA_COV : 1.0 # Covariance loss coeff
  GAMMA : 1.0 # Variance enforced by Variance term



  
